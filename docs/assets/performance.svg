<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 790" width="920" height="790" role="img" aria-labelledby="perfTitle perfDesc">
  <title id="perfTitle">Rendimiento medido de JarvisUNOQ</title>
  <desc id="perfDesc">Gráfico de barras con latencias reales del chat: 11,02 s en frío, 1,36 s y 2,44 s en caliente, 7,86 s para una respuesta de tres oraciones y 3,41 s tras eliminar OpenClaw. Abajo, throughput de llama.cpp: 16 tok/s de prompt eval y 10,6 tok/s de generación con Qwen2.5 0.5B, frente a 5,2 y 3,2 tok/s con el 1.5B.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="790" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="44" font-size="22" font-weight="700" fill="#e6edf7">Rendimiento medido en la Arduino UNO Q</text>
    <text x="40" y="68" font-size="13" fill="#8fa2bd">Ollama v0.40.14 · Qwen2.5 Q4_K_M · sin GPU · 4 núcleos · 3,6 GiB RAM · mediciones del 2026-11-04</text>
  </g>

  <!-- ================= Panel 1: latencia ================= -->
  <text x="40" y="112" font-size="14" font-weight="600" fill="#c8d4e5">Latencia de punta a punta con el 0.5B (segundos, menos es mejor)</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6f809a">
    <text x="80" y="334" text-anchor="end">0</text>
    <text x="80" y="296" text-anchor="end">2</text>
    <text x="80" y="258" text-anchor="end">4</text>
    <text x="80" y="220" text-anchor="end">6</text>
    <text x="80" y="182" text-anchor="end">8</text>
    <text x="80" y="144" text-anchor="end">10</text>
    <text x="80" y="106" text-anchor="end">12 s</text>
  </g>

  <g stroke="#1e2c42" stroke-width="1">
    <line x1="90" y1="330" x2="880" y2="330" stroke="#31486b"/>
    <line x1="90" y1="292" x2="880" y2="292"/>
    <line x1="90" y1="254" x2="880" y2="254"/>
    <line x1="90" y1="216" x2="880" y2="216"/>
    <line x1="90" y1="178" x2="880" y2="178"/>
    <line x1="90" y1="140" x2="880" y2="140"/>
    <line x1="90" y1="102" x2="880" y2="102"/>
    <line x1="90" y1="100" x2="90" y2="330" stroke="#31486b"/>
  </g>

  <!-- barras -->
  <g>
    <rect x="105" y="120.62" width="76" height="209.38" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="255" y="304.16" width="76" height="25.84" rx="4" fill="#38bdf8"/>
    <rect x="405" y="283.64" width="76" height="46.36" rx="4" fill="#38bdf8"/>
    <rect x="555" y="180.66" width="76" height="149.34" rx="4" fill="#38bdf8"/>
    <rect x="705" y="265.21" width="76" height="64.79" rx="4" fill="#38bdf8"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e6edf7" text-anchor="middle">
    <text x="143" y="111">11,02</text>
    <text x="293" y="294">1,36</text>
    <text x="443" y="274">2,44</text>
    <text x="593" y="171">7,86</text>
    <text x="743" y="255">3,41</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#8fa2bd" text-anchor="middle">
    <text x="143" y="352">Frío</text>
    <text x="143" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">incluye carga</text>
    <text x="293" y="352">Caliente</text>
    <text x="293" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">12 tok</text>
    <text x="443" y="352">Caliente</text>
    <text x="443" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">21 tok</text>
    <text x="593" y="352">3 oraciones</text>
    <text x="593" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">57 tok</text>
    <text x="743" y="352">Sin OpenClaw</text>
    <text x="743" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">8 tok</text>
  </g>

  <line x1="40" y1="400" x2="880" y2="400" stroke="#1e2c42" stroke-width="1"/>

  <!-- ================= Panel 2: throughput ================= -->
  <text x="40" y="432" font-size="14" font-weight="600" fill="#c8d4e5">Throughput de llama.cpp (tokens por segundo, más es mejor)</text>
  <text x="40" y="452" font-size="11" fill="#6f809a">Prompt eval sobre 36 tokens de entrada; generación sobre 16 y 14 tokens respectivamente.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8fa2bd">
    <rect x="700" y="426" width="12" height="12" rx="3" fill="#38bdf8"/>
    <text x="718" y="436">0,5B Q4_K_M</text>
    <rect x="800" y="426" width="12" height="12" rx="3" fill="#fbbf24"/>
    <text x="818" y="436">1,5B Q4_K_M</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6f809a">
    <text x="80" y="694" text-anchor="end">0</text>
    <text x="80" y="658" text-anchor="end">4</text>
    <text x="80" y="622" text-anchor="end">8</text>
    <text x="80" y="586" text-anchor="end">12</text>
    <text x="80" y="550" text-anchor="end">16 tok/s</text>
  </g>

  <g stroke="#1e2c42" stroke-width="1">
    <line x1="90" y1="690" x2="880" y2="690" stroke="#31486b"/>
    <line x1="90" y1="654" x2="880" y2="654"/>
    <line x1="90" y1="618" x2="880" y2="618"/>
    <line x1="90" y1="582" x2="880" y2="582"/>
    <line x1="90" y1="546" x2="880" y2="546"/>
    <line x1="90" y1="544" x2="90" y2="690" stroke="#31486b"/>
  </g>

  <g>
    <rect x="190" y="546" width="70" height="144" rx="4" fill="#38bdf8"/>
    <rect x="320" y="594.6" width="70" height="95.4" rx="4" fill="#38bdf8" opacity="0.7"/>
    <rect x="570" y="643.2" width="70" height="46.8" rx="4" fill="#fbbf24"/>
    <rect x="700" y="661.2" width="70" height="28.8" rx="4" fill="#fbbf24" opacity="0.7"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e6edf7" text-anchor="middle">
    <text x="225" y="536">16,0</text>
    <text x="355" y="585">10,6</text>
    <text x="605" y="634">5,2</text>
    <text x="735" y="652">3,2</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#8fa2bd" text-anchor="middle">
    <text x="225" y="712">0,5B · prompt</text>
    <text x="355" y="712">0,5B · generación</text>
    <text x="605" y="712">1,5B · prompt</text>
    <text x="735" y="712">1,5B · generación</text>
  </g>

  <text x="40" y="758" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6f809a">En reposo, con el modelo cargado, el CPU del sistema queda en ~0,3 %; durante la generación, llama-server usa los 4 núcleos (~99 %).</text>
</svg>
